    <!-- Prevent FOUC -->
    <script>
      (function() {
        var root = document.documentElement;
        var isDark = false;
        try {
          var theme = localStorage.getItem('mc_theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            root.classList.add('dark');
            isDark = true;
          }
        } catch (e) {}
        try {
          var colorMap = {
            'trust-blue': { light: '#F4F8FC', dark: '#0E1620', primary: '#2F6FB5' },
            'botanical-sage': { light: '#F3F8F6', dark: '#0D1917', primary: '#1E6B60' },
            'warm-hearth': { light: '#FAF6F1', dark: '#1A1412', primary: '#9E472A' },
            'harbor-dusk': { light: '#F5F6FB', dark: '#101322', primary: '#4C56A1' },
            'laguna-coastal': { light: '#F2F8FA', dark: '#0B171D', primary: '#0E6884' },
            'sampaguita-moss': { light: '#F6F8F2', dark: '#12170E', primary: '#456728' },
            'narra-amber': { light: '#FBF8F3', dark: '#19140E', primary: '#8A5316' },
            'alabang-rosewood': { light: '#FAF5F7', dark: '#1A1115', primary: '#943B57' },
            'monochrome-ink': { light: '#F6F7F9', dark: '#111317', primary: '#2C3646' }
          };
          var storedColor = localStorage.getItem('mc_color_theme');
          var colorTheme = (storedColor && colorMap[storedColor]) ? storedColor : 'trust-blue';
          root.setAttribute('data-color-theme', colorTheme);
          var metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor && colorMap[colorTheme]) {
            metaThemeColor.setAttribute('content', isDark ? colorMap[colorTheme].dark : colorMap[colorTheme].light);
          }
          var iconEl = document.querySelector('link[rel="icon"]');
          if (iconEl && colorMap[colorTheme]) {
            var encodedPrimary = encodeURIComponent(colorMap[colorTheme].primary);
            iconEl.setAttribute(
              'href',
              "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' rx='58' fill='" +
                encodedPrimary +
                "'/%3E%3Cg transform='translate(0 4)'%3E%3Crect x='77' y='66' width='14' height='28' rx='3' fill='%23fff'/%3E%3Cpath d='M52 112 128 58 204 112' fill='none' stroke='%23fff' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M128 198C128 198 78 152 78 130C78 112 92 102 106 102C117 102 125 108 128 114C131 108 139 102 150 102C164 102 178 112 178 130C178 152 128 198 128 198Z' fill='%23fff'/%3E%3Crect x='122' y='126' width='12' height='36' rx='3' fill='" +
                encodedPrimary +
                "'/%3E%3Crect x='110' y='138' width='36' height='12' rx='3' fill='" +
                encodedPrimary +
                "'/%3E%3C/g%3E%3C/svg%3E"
            );
          }
        } catch (e) {}
        try {
          var scaleMap = {
            'extra-compact': 0.8,
            'compact': 0.9,
            'standard': 1,
            'large': 1.15
          };
          var storedScale = localStorage.getItem('mc_ui_scale');
          var isMobile = window.matchMedia && window.matchMedia('(max-width: 767px)').matches;
          var resolvedPreset = (storedScale && scaleMap[storedScale]) ? storedScale : (isMobile ? 'compact' : 'standard');
          var scaleValue = scaleMap[resolvedPreset] || 1;
          root.style.setProperty('--ui-scale', String(scaleValue));
          root.setAttribute('data-ui-scale', resolvedPreset);
          root.setAttribute('data-ui-scale-mode', (storedScale && scaleMap[storedScale]) ? 'custom' : 'auto');
        } catch (e) {}
      })();
    </script>
